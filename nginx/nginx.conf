# ============================================================
# Proximo — Reverse proxy Nginx
# /        -> frontend Next.js (port 3000)
# /api     -> backend NestJS (port 3001)
# ============================================================

server {
    listen 80;
    server_name _;

    # Sécurité des en-têtes
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # Limites de corps de requête (JSON ~1 Mo ; uploads signalements jusqu'à
    # 5 fichiers de 10 Mo → 60 Mo pour être confortable)
    client_max_body_size 60m;

    # Frontend (Next.js)
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cette location déclare ses propres add_header → les en-têtes du
        # bloc server ne sont PAS hérités ici : on les re-déclare.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        # Assets hachés (nom = contenu) : cache long — Next envoie déjà
        # "public, max-age=31536000, immutable", on le garantit.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Idem : add_header propre → re-déclaration des en-têtes sécurité.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        # Le HTML Next.js est prérendu avec "s-maxage=31536000" : un cache
        # partagé (ou le cache heuristique du navigateur) peut servir une
        # page périmée pendant très longtemps. Les pages dépendent de la
        # session → jamais de cache sur le HTML.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # API (NestJS) — le préfixe /api est conservé tel quel
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
