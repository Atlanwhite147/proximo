# ============================================================
# Proximo — Intégration continue
# Vérifie : lint, tests unitaires, builds (backend + frontend),
# puis build + publication des images Docker sur GHCR
# (ghcr.io/bounette14701-oss/proximo-{backend,frontend}).
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lecture du dépôt + écriture des paquets GHCR (images Docker).
permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Restaurer le cache node_modules
        # Cache du dossier node_modules complet (clé = lock) : une fois chaud,
        # npm ci est quasi hors-ligne → insensible aux incidents npmjs.
        # Salé 2026-09-08 : purge d'un cache soupçonné corrompu (tests OK en
        # local, KO en CI) — le fallback restore-keys réinjectait l'ancien cache.
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-node-modules-${{ hashFiles('backend/package-lock.json') }}-v2

      - name: Pinner npm (bug "Exit handler never called!" de npm 10.9.x)
        run: npm install -g npm@10.8.2

      - name: Installer les dépendances
        # Résilience : le bug npm "Exit handler never called!" des runners
        # peut laisser un node_modules INCOMPLET avec un exit code 0.
        # Si le cache node_modules est restauré (binaire clé présent), on
        # SAUTE l'installation (npm ci purge node_modules → cache perdu).
        # Sinon : npm ci + vérification d'intégrité + retry via miroir.
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          MARKER=node_modules/.proximo-install-ok
          LOCK_HASH=$(sha256sum package-lock.json | cut -c1-12)
          # Ne sauter l'installation QUE si le cache correspond au lockfile
          # courant (sinon node_modules peut être obsolète : nouvelle
          # dépendance absente, client Prisma périmé, etc.).
          if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$LOCK_HASH" ]; then
            echo "Cache node_modules à jour — installation sautée."
            exit 0
          fi
          install_deps() {
            npm ci --no-audit --no-fund --prefer-offline \
              --fetch-retries=5 \
              --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=60000 "$@"
          }
          for i in 1 2 3; do
            echo "--- tentative $i/3 ---"
            if install_deps && [ -x node_modules/.bin/prisma ]; then
              echo "npm ci OK + intégrité vérifiée (prisma présent)"
              echo "$LOCK_HASH" > "$MARKER"
              break
            fi
            echo "node_modules incomplet ou échec — purge et nouvelle tentative…"
            rm -rf node_modules
            if install_deps --registry=https://registry.npmmirror.com \
              && [ -x node_modules/.bin/prisma ]; then
              echo "npm ci OK via miroir (tentative $i)"
              echo "$LOCK_HASH" > "$MARKER"
              break
            fi
            [ "$i" = 3 ] && { echo "npm ci a échoué 3 fois"; exit 1; }
            rm -rf node_modules
            sleep 15
          done

      - name: Générer le client Prisma
        # Binaire local épinglé (^5.22.0) — jamais npx (qui pourrait
        # installer prisma@latest, incompatible avec le schéma v5).
        run: ./node_modules/.bin/prisma generate

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restaurer le cache node_modules
        # Cache du dossier node_modules complet (clé = lock) : une fois chaud,
        # npm ci est quasi hors-ligne → insensible aux incidents npmjs.
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-node-modules-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            frontend-node-modules-

      - name: Pinner npm (bug "Exit handler never called!" de npm 10.9.x)
        run: npm install -g npm@10.8.2

      - name: Installer les dépendances
        # Résilience : le bug npm "Exit handler never called!" des runners
        # peut laisser un node_modules INCOMPLET avec un exit code 0.
        # Si le cache node_modules est restauré (binaire clé présent), on
        # SAUTE l'installation (npm ci purge node_modules → cache perdu).
        # Sinon : npm ci + vérification d'intégrité + retry via miroir.
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          MARKER=node_modules/.proximo-install-ok
          LOCK_HASH=$(sha256sum package-lock.json | cut -c1-12)
          if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$LOCK_HASH" ]; then
            echo "Cache node_modules à jour — installation sautée."
            exit 0
          fi
          install_deps() {
            npm ci --no-audit --no-fund --prefer-offline \
              --fetch-retries=5 \
              --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=60000 "$@"
          }
          for i in 1 2 3; do
            echo "--- tentative $i/3 ---"
            if install_deps && [ -x node_modules/.bin/next ]; then
              echo "npm ci OK + intégrité vérifiée (next présent)"
              echo "$LOCK_HASH" > "$MARKER"
              break
            fi
            echo "node_modules incomplet ou échec — purge et nouvelle tentative…"
            rm -rf node_modules
            if install_deps --registry=https://registry.npmmirror.com \
              && [ -x node_modules/.bin/next ]; then
              echo "npm ci OK via miroir (tentative $i)"
              echo "$LOCK_HASH" > "$MARKER"
              break
            fi
            [ "$i" = 3 ] && { echo "npm ci a échoué 3 fois"; exit 1; }
            rm -rf node_modules
            sleep 15
          done

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build et publication des images Docker (GHCR)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Publication uniquement sur main (pas sur les PR).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Valider docker-compose.yml
        # compose exige les secrets obligatoires ({VAR:?…}) ; sur le runner
        # il n'y a pas de .env → on fournit des valeurs de validation (la
        # commande ne fait que résoudre le fichier, aucun conteneur ne tourne).
        env:
          POSTGRES_PASSWORD: ci-validation-only
          JWT_ACCESS_SECRET: ci-validation-only
          JWT_REFRESH_SECRET: ci-validation-only
        run: docker compose config --quiet

      - name: Se connecter au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags GHCR)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Métadonnées frontend (tags GHCR)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build et push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build et push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
