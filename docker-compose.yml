# ============================================================
# Proximo — Orchestration du monorepo (1 commande : docker compose up)
# Services : db (PostgreSQL + PostGIS) · backend (NestJS) ·
#            frontend (Next.js) · nginx (reverse proxy)
# ============================================================

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: proximo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis — voir .env.example}
      POSTGRES_DB: proximo
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proximo -d proximo"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - proximo

  backend:
    # Image pré-buildée publiée sur GHCR (CI) ; sinon build local.
    image: ghcr.io/Atlanwhite147/proximo-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://proximo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis — voir .env.example}@db:5432/proximo?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET requis — voir .env.example}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET requis — voir .env.example}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Sprint 2 — administrateurs bootstrap (emails séparés par des virgules)
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Sprint 2 — Google OAuth2 (OpenID Connect)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      # Sprint 2 — emails transactionnels (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Proximo <no-reply@proximo.local>}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Proximo}
      SYNDIC_EMAIL: ${SYNDIC_EMAIL:-}
      # Commerce — paiement Stripe (checkout + webhook) et provisionnement
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      COMMERCE_DOMAIN: ${COMMERCE_DOMAIN:-147.ovh}
      # Sprint 2 — URLs publiques (frontend) et stockage des pièces jointes
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      API_URL: ${API_URL:-http://localhost:8080/api}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - proximo

  frontend:
    # Image pré-buildée publiée sur GHCR (CI) ; sinon build local.
    image: ghcr.io/Atlanwhite147/proximo-frontend:latest
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # URL interne du backend (nom du service Docker) pour le middleware
      # d'installation (redirection vers /install au premier lancement).
      API_INTERNAL_URL: http://backend:3001/api
      # URL publique (sitemap, robots.txt, Open Graph) — propre à chaque env.
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proximo

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - proximo

volumes:
  db_data:
  uploads_data:

networks:
  proximo:
    driver: bridge
